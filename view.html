<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>記録を見る</title>

    <link rel="stylesheet" href="record.css">
</head>

<body>

    <main class="container">

        <h1 id="date-title">記録</h1>

        <div>
            <p>
                ・睡眠時間：
                <span id="sleep-value"></span>
                時間
            </p>

            <p>
                ・プロテイン摂取量：
                <span id="protein-value"></span>
                g
            </p>

            <p>
                ・継続日数：
                <span id="streak-value"></span>
            </p>

            <p>
                ・累計セット数：
                <span id="sets-value"></span>
                セット
            </p>
        </div>

        <button id="edit-button">
            編集する
        </button>

        <button id="delete-button">
            この記録を削除
        </button>

        <button id="back-button">
            戻る
        </button>

    </main>

    <script src="view.js"></script>

</body>

</html>
